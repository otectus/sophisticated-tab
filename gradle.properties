# Gradle
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false
# NOTE: Gradle 8.10 must itself run on a JDK in the 17..21 range. If your system default
# JDK is newer, either run with JAVA_HOME pointing at a JDK 21, or set org.gradle.java.home
# locally (e.g. in ~/.gradle/gradle.properties, which is not committed). The mod compile/run
# toolchain is Java 21 regardless (configured in build.gradle).

# Minecraft + NeoForge (1.21.1 line)
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neoforge_version=21.1.84
neoforge_version_range=[21.1.0,)
loader_version_range=[4,)

# Parchment mappings (leave blank to use Mojang official)
parchment_mc_version=1.21.1
parchment_version=2024.11.17

# Mod
mod_id=sophisticatedtab
mod_name=Sophisticated Tab
mod_license=MIT
mod_version=1.21.1-0.6.0
mod_group=dev.otectus.sophisticatedtab
mod_authors=otectus
mod_description=Adds one Mod Tabs navigation tab per Sophisticated Backpack the player is carrying, each rendering the real ItemStack icon and opening that specific backpack on click.

# CurseForge dependencies (1.21.1 NeoForge) — verified file IDs (2026-06-30)
# Mod Tabs (the NeoForge successor to Legendary Tabs) — https://www.curseforge.com/minecraft/mc-mods/mod-tabs
modtabs_project=1313300
modtabs_file=8302708
# Sophisticated Backpacks — https://www.curseforge.com/minecraft/mc-mods/sophisticated-backpacks
sophisticatedbackpacks_project=422301
sophisticatedbackpacks_file=8344684
# Sophisticated Core — https://www.curseforge.com/minecraft/mc-mods/sophisticated-core
sophisticatedcore_project=618298
sophisticatedcore_file=8337387
# MidnightLib — runtime-only transitive dependency of Mod Tabs (its config system).
# Needed for `runClient`; not compiled against. https://www.curseforge.com/minecraft/mc-mods/midnightlib
midnightlib_project=488090
midnightlib_file=8028802
