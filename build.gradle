plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {}
        server {
            args '--nogui'
        }
    }
}

repositories {
    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net/'
    }
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    mavenLocal()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Upstream mods are resolved either via the composite builds wired in
    // settings.gradle (when ../LegendaryTabs and ../SophisticatedBackpacks
    // exist) or via CurseMaven as a fallback. Both paths produce deobf jars.
    compileOnly fg.deobf("curse.maven:legendarytabs-${legendarytabs_curse_project}:${legendarytabs_curse_file}")
    runtimeOnly fg.deobf("curse.maven:legendarytabs-${legendarytabs_curse_project}:${legendarytabs_curse_file}")

    compileOnly fg.deobf("curse.maven:sophisticated-backpacks-${sophisticatedbackpacks_curse_project}:${sophisticatedbackpacks_curse_file}")
    runtimeOnly fg.deobf("curse.maven:sophisticated-backpacks-${sophisticatedbackpacks_curse_project}:${sophisticatedbackpacks_curse_file}")

    // SophisticatedBackpacks depends on SophisticatedCore: IBackpackWrapper
    // extends IStorageWrapper, SBPPacketHandler extends PacketHandler, and
    // BackpackScreen extends StorageScreenBase — all defined in Core. We need
    // it on the compile classpath, not just at runtime.
    compileOnly fg.deobf("curse.maven:sophisticated-core-${sophisticatedcore_curse_project}:${sophisticatedcore_curse_file}")
    runtimeOnly fg.deobf("curse.maven:sophisticated-core-${sophisticatedcore_curse_project}:${sophisticatedcore_curse_file}")
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            forge_version           : forge_version,
            forge_version_range     : forge_version_range,
            loader_version_range    : loader_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_authors             : mod_authors,
            mod_description         : mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'    : mod_id,
                'Specification-Vendor'   : mod_authors,
                'Specification-Version'  : '1',
                'Implementation-Title'   : project.name,
                'Implementation-Version' : project.version,
                'Implementation-Vendor'  : mod_authors,
        ])
    }
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url = "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
