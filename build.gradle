plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = mod_version
group = mod_group

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven {
        name = 'Curse Maven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

neoForge {
    version = neoforge_version

    if (parchment_version?.trim() && parchment_mc_version?.trim()) {
        parchment {
            mappingsVersion = parchment_version
            minecraftVersion = parchment_mc_version
        }
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
        }
        client {
            client()
            programArguments.addAll '--username', 'Dev'
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // The mod compiles and runs against Mod Tabs + Sophisticated Backpacks/Core.
    // Resolved via CurseMaven (deobf jars produced automatically by ModDevGradle).
    compileOnly "curse.maven:mod-tabs-${modtabs_project}:${modtabs_file}"
    runtimeOnly "curse.maven:mod-tabs-${modtabs_project}:${modtabs_file}"

    compileOnly "curse.maven:sophisticated-backpacks-${sophisticatedbackpacks_project}:${sophisticatedbackpacks_file}"
    runtimeOnly "curse.maven:sophisticated-backpacks-${sophisticatedbackpacks_project}:${sophisticatedbackpacks_file}"

    // Sophisticated Backpacks extends Sophisticated Core (IBackpackWrapper extends
    // IStorageWrapper, BackpackScreen extends StorageScreenBase) — needed at compile time.
    compileOnly "curse.maven:sophisticated-core-${sophisticatedcore_project}:${sophisticatedcore_file}"
    runtimeOnly "curse.maven:sophisticated-core-${sophisticatedcore_project}:${sophisticatedcore_file}"

    // Mod Tabs requires MidnightLib at runtime (config system). Runtime-only so the
    // dev client (runClient) can actually load Mod Tabs.
    runtimeOnly "curse.maven:midnightlib-${midnightlib_project}:${midnightlib_file}"
}

processResources {
    def replaceProps = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neoforge_version       : neoforge_version,
        neoforge_version_range : neoforge_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description        : mod_description,
    ]
    inputs.properties replaceProps
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProps
    }
}

jar {
    manifest {
        attributes(
            'Specification-Title'    : mod_id,
            'Specification-Vendor'   : mod_authors,
            'Specification-Version'  : '1',
            'Implementation-Title'   : project.name,
            'Implementation-Version' : project.jar.archiveVersion,
            'Implementation-Vendor'  : mod_authors
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
